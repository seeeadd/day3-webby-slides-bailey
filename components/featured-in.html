<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Featured In - AI Design & Grow Experience</title>
  <style>
    /* ═══════════════════════════════════════════════════════════════════════════
       FONTS - Google Fonts fallback (for standalone preview)
       ═══════════════════════════════════════════════════════════════════════════ */
    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap');

    :root {
      --font-headline: 'OGG', 'DM Serif Display', Georgia, serif;
      --font-body: 'Satoshi', 'Inter', -apple-system, sans-serif;
      --cream: #FAF9F7;
      --gold: #D4A853;
      --dark: #1F1D1A;
      --muted: #5A544C;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background: var(--cream);
      color: var(--dark);
      -webkit-font-smoothing: antialiased;
    }

    /* ═══════════════════════════════════════════════════════════════════════════
       FEATURED IN SECTION - Compact Editorial Social Proof
       ═══════════════════════════════════════════════════════════════════════════ */

    .featured-section {
      width: 100%;
      padding: 2.5rem 1.5rem;
      background: var(--cream);
    }

    .featured-inner {
      max-width: 900px;
      margin: 0 auto;
    }

    /* Header */
    .featured-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .featured-sparkle {
      color: var(--gold);
      font-size: 0.6rem;
      animation: sparkle-pulse 2s ease-in-out infinite;
    }

    .featured-sparkle:nth-child(3) {
      animation-delay: 1s;
    }

    @keyframes sparkle-pulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    .featured-label {
      font-family: var(--font-body);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* Card */
    .featured-card {
      position: relative;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 1.5rem 2rem;
      border: 1px solid rgba(0, 0, 0, 0.04);
      box-shadow: 0 2px 12px rgba(31, 29, 26, 0.03);
      overflow: hidden;
    }

    /* Subtle shimmer */
    .featured-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.4) 50%,
        transparent 100%
      );
      animation: shimmer 8s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes shimmer {
      0% { left: -100%; }
      40%, 100% { left: 100%; }
    }

    /* Logos */
    .featured-logos {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 2rem;
    }

    .featured-logo {
      height: 26px;
      transition: all 0.3s ease;
      filter: grayscale(100%) opacity(0.55);
    }

    .featured-logo:hover {
      filter: grayscale(0%) opacity(1);
      transform: translateY(-1px);
    }

    .featured-logo img {
      height: 100%;
      width: auto;
      object-fit: contain;
      display: block;
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .featured-card::after,
      .featured-sparkle {
        animation: none;
      }
      .featured-logo {
        filter: grayscale(0%) opacity(0.7);
        transition: none;
      }
    }

    /* Mobile */
    @media (max-width: 768px) {
      .featured-section {
        padding: 2rem 1rem;
      }
      .featured-card {
        padding: 1.25rem 1.5rem;
        border-radius: 12px;
      }
      .featured-logos {
        gap: 1.5rem;
      }
      .featured-logo {
        height: 22px;
      }
    }

    @media (max-width: 480px) {
      .featured-logos {
        gap: 1rem 1.25rem;
      }
      .featured-logo {
        height: 18px;
      }
    }
  </style>
</head>
<body>

  <section class="featured-section">
    <div class="featured-inner">
      <div class="featured-header">
        <span class="featured-sparkle">✦</span>
        <span class="featured-label">As Seen In</span>
        <span class="featured-sparkle">✦</span>
      </div>

      <div class="featured-card">
        <div class="featured-logos">
          <a href="#" class="featured-logo" aria-label="Kittl">
            <img src="https://i.imgur.com/tJAzwFE.png" alt="Kittl" loading="lazy" />
          </a>
          <a href="#" class="featured-logo" aria-label="EverBee">
            <img src="https://i.imgur.com/5ppDgBG.png" alt="EverBee" loading="lazy" />
          </a>
          <a href="#" class="featured-logo" aria-label="INSIDER">
            <img src="https://i.imgur.com/wnBCDnO.png" alt="INSIDER" loading="lazy" />
          </a>
          <a href="#" class="featured-logo" aria-label="Sell Your Stuff">
            <img src="https://i.imgur.com/bcTuezZ.png" alt="Sell Your Stuff" loading="lazy" />
          </a>
          <a href="#" class="featured-logo" aria-label="UpFlip">
            <img src="https://i.imgur.com/pWAzIGN.png" alt="UpFlip" loading="lazy" />
          </a>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
