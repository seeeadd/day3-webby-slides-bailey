<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Featured In</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
    }

    body {
      font-family: 'Satoshi', 'Inter', sans-serif;
      background: #FAF9F7;
    }

    /* ═══════════════════════════════════════════════════════════════════════════
       FEATURED IN - Compact Section, Large Content
       ═══════════════════════════════════════════════════════════════════════════ */

    .featured-section {
      width: 100vw;
      margin-left: calc(-50vw + 50%);
      padding: 2.5rem 1.5rem;
      background: #FAF9F7;
    }

    .featured-inner {
      max-width: 1100px;
      margin: 0 auto;
    }

    .featured-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .featured-sparkle {
      color: #D4A853;
      font-size: 0.65rem;
      animation: sparkle-pulse 2s ease-in-out infinite;
    }

    .featured-sparkle:nth-child(3) {
      animation-delay: 1s;
    }

    @keyframes sparkle-pulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .featured-label {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #8A8480;
    }

    .featured-card {
      position: relative;
      background: rgba(255, 255, 255, 0.65);
      border-radius: 16px;
      padding: 2.25rem 3rem;
      border: 1px solid rgba(0, 0, 0, 0.03);
      overflow: hidden;
    }

    /* Internal gradient glow */
    .featured-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 16px;
      background: linear-gradient(
        135deg,
        rgba(212, 168, 83, 0.08) 0%,
        rgba(29, 107, 107, 0.06) 50%,
        rgba(212, 168, 83, 0.08) 100%
      );
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    .featured-card:hover::before {
      opacity: 1;
    }

    /* Shimmer effect */
    .featured-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(212, 168, 83, 0.06) 45%,
        rgba(255, 255, 255, 0.2) 50%,
        rgba(212, 168, 83, 0.06) 55%,
        transparent 100%
      );
      animation: shimmer 6s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes shimmer {
      0% { left: -100%; }
      50%, 100% { left: 100%; }
    }

    /* Border glow on hover */
    .featured-card-glow {
      position: absolute;
      top: -1px;
      left: -1px;
      right: -1px;
      bottom: -1px;
      border-radius: 17px;
      background: linear-gradient(135deg,
        rgba(212, 168, 83, 0.35) 0%,
        rgba(29, 107, 107, 0.25) 50%,
        rgba(212, 168, 83, 0.35) 100%);
      opacity: 0;
      z-index: -1;
      transition: opacity 0.4s ease;
      filter: blur(8px);
    }

    .featured-card:hover .featured-card-glow {
      opacity: 1;
    }

    .featured-logos {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 3.5rem;
    }

    .featured-logo {
      height: 44px;
      opacity: 0.75;
      transition: opacity 0.2s, filter 0.2s;
    }

    .featured-logo:hover {
      opacity: 1;
    }

    .featured-logo img {
      height: 100%;
      width: auto;
      display: block;
      filter: grayscale(60%);
    }

    .featured-logo:hover img {
      filter: grayscale(0%);
    }

    @media (max-width: 768px) {
      .featured-section {
        padding: 2rem 1rem;
      }
      .featured-card {
        padding: 1.75rem 1.5rem;
      }
      .featured-logos {
        gap: 2.5rem;
      }
      .featured-logo {
        height: 32px;
      }
    }

    @media (max-width: 480px) {
      .featured-logos {
        gap: 1.75rem;
      }
      .featured-logo {
        height: 26px;
      }
    }
  </style>
</head>
<body>

  <section class="featured-section">
    <div class="featured-inner">
      <div class="featured-header">
        <span class="featured-sparkle">✦</span>
        <span class="featured-label">As Seen In</span>
        <span class="featured-sparkle">✦</span>
      </div>

      <div class="featured-card">
        <div class="featured-card-glow"></div>
        <div class="featured-logos">
          <a href="#" class="featured-logo"><img src="https://i.imgur.com/bcTuezZ.png" alt="Sell Your Stuff" /></a>
          <a href="#" class="featured-logo"><img src="https://i.imgur.com/pWAzIGN.png" alt="UpFlip" /></a>
          <a href="#" class="featured-logo"><img src="https://i.imgur.com/tJAzwFE.png" alt="Kittl" /></a>
          <a href="#" class="featured-logo"><img src="https://i.imgur.com/wnBCDnO.png" alt="INSIDER" /></a>
          <a href="#" class="featured-logo"><img src="https://i.imgur.com/5ppDgBG.png" alt="EverBee" /></a>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
